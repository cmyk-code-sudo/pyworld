[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "pyworld"
version = "0.1.0"
description = "A Python library for interactive gaming with Chinese NLP, UI systems, and Android support"
readme = "README.md"
requires-python = ">=3.7"
license = {text = "MIT"}
authors = [
    {name = "cmyk-code-sudo", email = "your-email@example.com"}
]
keywords = ["game", "ui", "nlp", "chinese", "android", "kivy"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
]

dependencies = [
    "kivy>=2.1.0",
    "jieba>=0.42.1",
    "numpy>=1.19.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "black>=21.0",
    "pylint>=2.10",
]

[project.urls]
Homepage = "https://github.com/cmyk-code-sudo/pyworld"
Repository = "https://github.com/cmyk-code-sudo/pyworld.git"
Issues = "https://github.com/cmyk-code-sudo/pyworld/issues"

[project.scripts]
pyworld = "pyworld.cli:main"